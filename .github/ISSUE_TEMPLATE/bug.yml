name: Bug report
description: Report a reproducible, sanitized defect.
title: 'fix: '
body:
  - type: markdown
    attributes:
      value: 'Never include live credentials or private traffic. Use SECURITY.md for vulnerabilities.'
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/architecture, deployment mode, downstream client, proxy protocol.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction, expected behavior, and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized config and logs
      description: Remove passwords, tokens, cookies, private IPs, and user traffic.
