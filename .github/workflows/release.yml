name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify backend
        run: |
          go test -count=1 ./...
          go vet ./...
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: proxysieve.spdx.json
          artifact-name: proxysieve-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.1
      - name: Build draft release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create portable provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const subjects = readFileSync('dist/checksums.txt', 'utf8')
            .trim()
            .split(/\r?\n/)
            .map((line) => {
              const match = line.match(/^([a-f0-9]{64})\s+(.+)$/);
              if (!match) throw new Error(`Invalid checksum line: ${line}`);
              return { name: match[2], digest: { sha256: match[1] } };
            });
          const sbom = readFileSync('proxysieve.spdx.json');
          subjects.push({
            name: 'proxysieve.spdx.json',
            digest: { sha256: createHash('sha256').update(sbom).digest('hex') },
          });
          subjects.sort((left, right) => left.name.localeCompare(right.name));

          const server = process.env.GITHUB_SERVER_URL;
          const repository = process.env.GITHUB_REPOSITORY;
          const statement = {
            _type: 'https://in-toto.io/Statement/v1',
            subject: subjects,
            predicateType: 'https://slsa.dev/provenance/v1',
            predicate: {
              buildDefinition: {
                buildType: 'https://actions.github.io/buildtypes/workflow/v1',
                externalParameters: {
                  workflow: {
                    ref: process.env.GITHUB_REF,
                    repository: `${server}/${repository}`,
                    path: '.github/workflows/release.yml',
                  },
                },
                internalParameters: {
                  github: {
                    eventName: process.env.GITHUB_EVENT_NAME,
                    runAttempt: process.env.GITHUB_RUN_ATTEMPT,
                    runId: process.env.GITHUB_RUN_ID,
                  },
                },
                resolvedDependencies: [{
                  uri: `git+${server}/${repository}@${process.env.GITHUB_REF}`,
                  digest: { gitCommit: process.env.GITHUB_SHA },
                }],
              },
              runDetails: {
                builder: { id: `${server}/${process.env.GITHUB_WORKFLOW_REF}` },
                metadata: {
                  invocationId: `${server}/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`,
                },
              },
            },
          };
          const output = `proxysieve-${process.env.RELEASE_TAG}.provenance.json`;
          writeFileSync(output, `${JSON.stringify(statement, null, 2)}\n`);
          NODE
          gh release upload "$RELEASE_TAG" "proxysieve-$RELEASE_TAG.provenance.json" --clobber
      - name: Attest release archives
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest SBOM
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: proxysieve.spdx.json

  native-smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
            extension: tar.gz
            binary: proxysieve
          - runner: windows-latest
            target: windows
            extension: zip
            binary: proxysieve.exe
          - runner: macos-latest
            target: darwin
            extension: tar.gz
            binary: proxysieve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download and verify release archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXTENSION: ${{ matrix.extension }}
          BINARY: ${{ matrix.binary }}
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "proxysieve_*_$($env:TARGET)_amd64.$($env:EXTENSION)" --pattern checksums.txt
          $archives = @(Get-ChildItem -File "proxysieve_*_$($env:TARGET)_amd64.$($env:EXTENSION)")
          if ($archives.Count -ne 1) { throw "Expected one $($env:TARGET) archive, found $($archives.Count)" }
          $archive = $archives[0]
          $checksum = Get-Content checksums.txt | Where-Object { $_ -match "  $([regex]::Escape($archive.Name))$" }
          if (-not $checksum) { throw "Checksum missing for $($archive.Name)" }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne ($checksum -split '\s+')[0]) { throw "Checksum mismatch for $($archive.Name)" }
          New-Item -ItemType Directory smoke | Out-Null
          if ($env:EXTENSION -eq 'zip') { Expand-Archive $archive smoke } else { tar -xzf $archive -C smoke }
          $binaries = @(Get-ChildItem smoke -Recurse -File -Filter $env:BINARY)
          $configs = @(Get-ChildItem smoke -Recurse -File -Filter config.example.yaml)
          if ($binaries.Count -ne 1 -or $configs.Count -ne 1) { throw 'Release archive layout is invalid' }
          $binary = $binaries[0]
          $config = $configs[0]
          & $binary.FullName version
          & $binary.FullName config validate --file $config.FullName
