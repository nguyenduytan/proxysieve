# Configuration schema v1. Validate without starting a listener:
# proxysieve config validate --file config.example.yaml
version: 1
listeners:
  - name: http
    type: http
    bind: "127.0.0.1:8080"
    auth: local
    policy: default
    max_connections: 256
    idle_timeout: 2m
admin:
  bind: "127.0.0.1:9090"
traffic:
  retention_days: 30
  minute_retention_days: 90
  hour_retention_days: 365
  day_retention_days: 3650
  aggregation_interval: 1m
health:
  failure_threshold: 3
  success_threshold: 2
  open_duration: 1m
  initial_score: 50
  success_gain: 5
  failure_penalty: 15
  treat_403_as_failure: false
  treat_429_as_failure: true
  treat_5xx_as_failure: true
  active_checks: false
  check_host: example.com
  check_port: 443
  check_interval: 5m
  check_timeout: 15s
  global_checks_per_minute: 60
  pool_checks_per_minute: 30
retry:
  # Total attempts, including the first request. Set to 1 to disable retries.
  max_attempts: 2
  allow_idempotency_key: false
budgets: []
# Ordered proxy chains are optional. Each referenced pool must already exist.
# chains:
#   - id: corporate-to-residential
#     name: Corporate to residential
#     enabled: true
#     hops:
#       - pool: corporate
#         timeout: 10s
#       - pool: residential-ca
#         timeout: 20s
inspect:
  enabled: false
cache:
  response:
    enabled: false
security:
  deny_private_networks_for_untrusted_clients: true
  allow_direct: false
  direct_allowlist: []
