# Configuration schema v1. Validate without starting a listener:
# proxysieve config validate --file config.example.yaml
version: 1
listeners:
  - name: http
    type: http
    bind: "127.0.0.1:8080"
    auth: local
    policy: default
    max_connections: 256
    idle_timeout: 2m
admin:
  bind: "127.0.0.1:9090"
traffic:
  retention_days: 30
  minute_retention_days: 90
  hour_retention_days: 365
  day_retention_days: 3650
  aggregation_interval: 1m
budgets: []
inspect:
  enabled: false
cache:
  response:
    enabled: false
security:
  deny_private_networks_for_untrusted_clients: true
  allow_direct: false
  direct_allowlist: []
