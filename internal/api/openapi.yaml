openapi: 3.1.0
info:
  title: ProxySieve local control-plane API
  version: 0.1.0
  description: >-
    The authenticated local Admin API exposed by ProxySieve. This contract
    describes the implemented surface; planned resources are intentionally omitted.
servers:
  - url: http://127.0.0.1:9090
    description: Default local-only listener
tags:
  - name: Auth
  - name: Users
  - name: System
  - name: Traffic
  - name: Events
  - name: Alerts
  - name: Budgets
  - name: Cache
  - name: Health
  - name: Proxies
  - name: Sources
  - name: Pools
  - name: Chains
  - name: Sessions
  - name: Policies
  - name: Runtime
  - name: Clients
  - name: Browser
  - name: Audit
paths:
  /health:
    get:
      tags: [System]
      security: []
      responses:
        '200': {description: Healthy}
  /ready:
    get:
      tags: [System]
      security: []
      responses:
        '200': {description: Ready}
  /api/v1/openapi.yaml:
    get:
      tags: [System]
      security: []
      responses:
        '200':
          description: OpenAPI contract
          content:
            application/yaml: {schema: {type: string}}
  /api/v1/auth/setup-status:
    get:
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Whether first-run setup is required
          content:
            application/json: {schema: {$ref: '#/components/schemas/SetupStatus'}}
  /api/v1/auth/setup:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: {type: string}
                username: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, format: password, minLength: 12}
      responses:
        '201': {description: Administrator created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: Authenticated user, headers: {Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '204': {description: Session ended}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/users:
    get:
      tags: [Users]
      responses:
        '200': {description: Admin user accounts, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/User'}}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Users]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserInput'}}}
      responses:
        '201': {description: User created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Username already exists}
  /api/v1/users/{userId}:
    parameters: [{name: userId, in: path, required: true, schema: {type: string}}]
    patch:
      tags: [Users]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserInput'}}}
      responses:
        '200': {description: User updated and its existing sessions invalidated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Duplicate username or last-admin protection}
    delete:
      tags: [Users]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '204': {description: User deleted and its existing sessions invalidated}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Self-delete or last-admin protection}
  /api/v1/system/info:
    get:
      tags: [System]
      responses:
        '200': {description: Build, current user and listener runtime information, content: {application/json: {schema: {$ref: '#/components/schemas/SystemInfo'}}}}
  /api/v1/traffic/live:
    get:
      tags: [Traffic]
      responses:
        '200': {description: Bounded live event buffer and persistence stats}
  /api/v1/traffic/history:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Recent durable events}
  /api/v1/traffic/summary:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/Until'}, {$ref: '#/components/parameters/ClientID'}, {$ref: '#/components/parameters/PoolID'}, {$ref: '#/components/parameters/ProxyID'}, {$ref: '#/components/parameters/ChainID'}, {$ref: '#/components/parameters/PolicyID'}, {$ref: '#/components/parameters/RuleID'}, {$ref: '#/components/parameters/Action'}, {$ref: '#/components/parameters/Protocol'}]
      responses:
        '200': {description: Bounded traffic summary, content: {application/json: {schema: {$ref: '#/components/schemas/TrafficSummary'}}}}
  /api/v1/traffic/timeseries:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/Until'}, {$ref: '#/components/parameters/ClientID'}, {$ref: '#/components/parameters/PoolID'}, {$ref: '#/components/parameters/ProxyID'}, {$ref: '#/components/parameters/ChainID'}, {$ref: '#/components/parameters/PolicyID'}, {$ref: '#/components/parameters/RuleID'}, {$ref: '#/components/parameters/Action'}, {$ref: '#/components/parameters/Protocol'}, {name: granularity, in: query, required: true, schema: {type: string, enum: [minute, hour, day]}}]
      responses:
        '200': {description: Bounded traffic series, content: {application/json: {schema: {$ref: '#/components/schemas/TrafficSeries'}}}}
  /api/v1/traffic/breakdown:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/Until'}, {$ref: '#/components/parameters/ClientID'}, {$ref: '#/components/parameters/PoolID'}, {$ref: '#/components/parameters/ProxyID'}, {$ref: '#/components/parameters/ChainID'}, {$ref: '#/components/parameters/PolicyID'}, {$ref: '#/components/parameters/RuleID'}, {$ref: '#/components/parameters/Action'}, {$ref: '#/components/parameters/Protocol'}, {name: dimension, in: query, required: true, schema: {type: string, enum: [client, pool, proxy, chain, policy, rule, action, protocol]}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}]
      responses:
        '200': {description: Top traffic values for one bounded dimension, content: {application/json: {schema: {$ref: '#/components/schemas/TrafficBreakdown'}}}}
  /api/v1/browser/policy:
    get:
      tags: [Browser]
      security: [clientBearer: []]
      responses:
        '200': {description: Short-lived active browser policy snapshot scoped to the authenticated client, content: {application/json: {schema: {$ref: '#/components/schemas/BrowserPolicySnapshot'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Client authentication or active runtime is unavailable}
  /api/v1/browser/blocks:
    post:
      tags: [Browser]
      security: [clientBearer: []]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BrowserBlockBatch'}
      responses:
        '202': {description: Bounded local-block batch accepted as untrusted estimated telemetry}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Browser block reporting is unavailable}
  /api/v1/budgets:
    get:
      tags: [Budgets]
      responses:
        '200': {description: Revisioned active budget configuration and current usage, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetStatusPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Budget usage could not be read}
    post:
      tags: [Budgets]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [budget], properties: {budget: {$ref: '#/components/schemas/BudgetConfig'}}}}}
      responses:
        '201': {description: Budget created and applied to new reservations, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetStatus'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Budget ID already exists}
  /api/v1/budgets/{budgetId}:
    parameters: [{name: budgetId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Budgets]
      responses:
        '200': {description: Budget configuration and current usage, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetStatus'}}}}
        '404': {description: Budget not found}
    patch:
      tags: [Budgets]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [budget, revision], properties: {budget: {$ref: '#/components/schemas/BudgetConfig'}, revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Budget updated and applied to new reservations, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetStatus'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Budget not found}
        '409': {description: Budget revision is stale}
    delete:
      tags: [Budgets]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Budget deleted for new reservations; historical usage is retained}
        '404': {description: Budget not found}
        '409': {description: Budget revision is stale}
  /api/v1/budgets/{budgetId}/usage:
    parameters: [{name: budgetId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Budgets]
      responses:
        '200': {description: Budget configuration and current usage, content: {application/json: {schema: {$ref: '#/components/schemas/BudgetStatus'}}}}
        '404': {description: Budget not found}
  /api/v1/traffic/stream:
    get:
      tags: [Traffic]
      responses:
        '200': {description: Bounded server-sent stream of new traffic events, content: {text/event-stream: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Traffic streaming is unavailable or at capacity}
  /api/v1/events:
    get:
      tags: [Events]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Newest sanitized process-lifetime operational events, content: {application/json: {schema: {$ref: '#/components/schemas/EventPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/events/stream:
    get:
      tags: [Events]
      responses:
        '200': {description: Bounded server-sent stream of new operational events, content: {text/event-stream: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {description: Operational event streaming is unavailable or at capacity}
  /api/v1/alerts:
    get:
      tags: [Alerts]
      responses:
        '200': {description: Revisioned alert rules, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRulePage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rule], properties: {rule: {$ref: '#/components/schemas/AlertRule'}}}}}
      responses:
        '201': {description: Alert rule created, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRuleRecord'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Alert rule ID already exists}
  /api/v1/alerts/{alertId}:
    parameters: [{name: alertId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Alerts]
      responses:
        '200': {description: Alert rule, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRuleRecord'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rule, revision], properties: {rule: {$ref: '#/components/schemas/AlertRule'}, revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Alert rule updated, content: {application/json: {schema: {$ref: '#/components/schemas/AlertRuleRecord'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Alert rule revision is stale}
    delete:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RevisionInput'}}}
      responses:
        '204': {description: Alert rule deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Alert rule revision is stale}
  /api/v1/webhooks:
    get:
      tags: [Alerts]
      responses:
        '200': {description: Revisioned webhook destinations and process-lifetime dispatcher statistics, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [webhook], properties: {webhook: {$ref: '#/components/schemas/Webhook'}}}}}
      responses:
        '201': {description: Webhook created, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookRecord'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Webhook ID already exists}
  /api/v1/webhooks/{webhookId}:
    parameters: [{name: webhookId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Alerts]
      responses:
        '200': {description: Webhook destination, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookRecord'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [webhook, revision], properties: {webhook: {$ref: '#/components/schemas/Webhook'}, revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Webhook updated, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookRecord'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Webhook revision is stale}
    delete:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RevisionInput'}}}
      responses:
        '204': {description: Webhook deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Webhook revision is stale or destination is referenced by an alert rule}
  /api/v1/webhooks/{webhookId}/test:
    parameters: [{name: webhookId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Alerts]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '200': {description: Completed webhook test attempt, content: {application/json: {schema: {type: object, required: [delivery], properties: {delivery: {$ref: '#/components/schemas/WebhookDelivery'}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {description: Webhook delivery is unavailable}
  /api/v1/webhooks/{webhookId}/deliveries:
    parameters: [{name: webhookId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/Limit'}]
    get:
      tags: [Alerts]
      responses:
        '200': {description: Newest bounded delivery attempts for one webhook, content: {application/json: {schema: {$ref: '#/components/schemas/WebhookDeliveryPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/cache/stats:
    get:
      tags: [Cache]
      responses:
        '200': {description: Active response cache status, content: {application/json: {schema: {$ref: '#/components/schemas/CacheStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/cache/purge:
    post:
      tags: [Cache]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '200': {description: Purged response cache entries and current statistics, content: {application/json: {schema: {$ref: '#/components/schemas/CachePurgeResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Response cache is disabled}
  /api/v1/cache/purge/domain:
    post:
      tags: [Cache]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain]
              properties:
                domain: {type: string, maxLength: 253, description: Exact hostname; subdomains are not included}
      responses:
        '200': {description: Purged entries for the exact hostname and current statistics, content: {application/json: {schema: {$ref: '#/components/schemas/CacheDomainPurgeResponse'}}}}
        '400': {description: Invalid hostname}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Response cache is disabled}
  /api/v1/health/proxies:
    get:
      tags: [Health]
      responses:
        '200': {description: Active runtime proxy health, content: {application/json: {schema: {$ref: '#/components/schemas/ProxyHealthPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/health/pools:
    get:
      tags: [Health]
      responses:
        '200': {description: Active runtime pool health, content: {application/json: {schema: {$ref: '#/components/schemas/PoolHealthPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/health/proxies/{proxyId}/check:
    post:
      tags: [Health]
      security: [sessionCookie: [], csrfToken: []]
      parameters: [{name: proxyId, in: path, required: true, schema: {type: string}}]
      requestBody: {$ref: '#/components/requestBodies/HealthCheckTarget'}
      responses:
        '200': {description: Updated proxy health, content: {application/json: {schema: {type: object, required: [result], properties: {result: {$ref: '#/components/schemas/ProxyHealth'}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Proxy disabled or check already running}
  /api/v1/health/pools/{poolId}/check:
    post:
      tags: [Health]
      security: [sessionCookie: [], csrfToken: []]
      parameters: [{name: poolId, in: path, required: true, schema: {type: string}}]
      requestBody: {$ref: '#/components/requestBodies/HealthCheckTarget'}
      responses:
        '200': {description: Updated pool health, content: {application/json: {schema: {type: object, required: [result], properties: {result: {$ref: '#/components/schemas/PoolHealth'}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Pool disabled or an endpoint check already running}
  /api/v1/audit:
    get:
      tags: [Audit]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: before, in: query, schema: {type: string, format: date-time}}, {name: before_id, in: query, schema: {type: string}}]
      responses:
        '200':
          description: Sanitized administrator audit events with a stable timestamp/id cursor
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/proxies:
    get:
      tags: [Proxies]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Proxy inventory}
    post:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [endpoint], properties: {endpoint: {type: object}}}}
      responses:
        '201': {description: Proxy inventory record created}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/proxies/import/preview:
    post:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: {type: string, maxLength: 8388608}
                format: {$ref: '#/components/schemas/ImportFormat'}
                mapping: {$ref: '#/components/schemas/ImportMapping'}
      responses:
        '200': {description: Parsed proxy import preview}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/proxies/import:
    post:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: {type: string, maxLength: 8388608}
                mode: {type: string, enum: [skip, update, create], default: skip}
                format: {$ref: '#/components/schemas/ImportFormat'}
                mapping: {$ref: '#/components/schemas/ImportMapping'}
      responses:
        '201': {description: Proxy inventory import committed atomically}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Inventory changed during import}
  /api/v1/proxies/{proxyId}:
    parameters: [{name: proxyId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Proxies]
      responses:
        '200': {description: Proxy inventory record}
        '404': {description: Proxy not found}
    patch:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, revision]
              properties:
                endpoint: {$ref: '#/components/schemas/ProxyEndpoint'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Proxy inventory record updated}
        '409': {description: Stale proxy revision}
        '404': {description: Proxy not found}
    delete:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '204': {description: Proxy inventory record deleted}
        '409': {description: Stale proxy revision}
        '404': {description: Proxy not found}
  /api/v1/sources:
    get:
      tags: [Sources]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Proxy source inventory}
    post:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: {$ref: '#/components/schemas/ProxySource'}
      responses:
        '201': {description: Proxy source created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Source ID already exists}
  /api/v1/sources/{sourceId}:
    parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Sources]
      responses:
        '200': {description: Proxy source record}
        '404': {description: Source not found}
    patch:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, revision]
              properties:
                source: {$ref: '#/components/schemas/ProxySource'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Proxy source updated}
        '409': {description: Stale source revision}
        '404': {description: Source not found}
    delete:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '204': {description: Proxy source deleted}
        '409': {description: Stale source revision}
        '404': {description: Source not found}
  /api/v1/sources/{sourceId}/refresh:
    parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Source fetched and endpoint inventory reconciled atomically
          content:
            application/json:
              schema:
                type: object
                required: [source, created, updated, skipped, invalid]
                properties:
                  source:
                    type: object
                    required: [source, revision]
                    properties:
                      source: {$ref: '#/components/schemas/ProxySource'}
                      revision: {type: integer, minimum: 1}
                  created: {type: integer, minimum: 0}
                  updated: {type: integer, minimum: 0}
                  skipped: {type: integer, minimum: 0}
                  invalid: {type: integer, minimum: 0}
        '409': {description: Source disabled, already refreshing or revision changed during refresh}
        '422': {description: Source type, configuration or proxy input is unsupported or invalid}
        '502': {description: Source fetch rejected or failed}
        '503': {description: Atomic inventory storage unavailable}
  /api/v1/pools:
    get:
      tags: [Pools]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
