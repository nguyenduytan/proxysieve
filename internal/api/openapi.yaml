  /api/v1/chains/{chainId}/test:
    parameters: [{name: chainId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_host, target_port]
              properties:
                target_host: {type: string, minLength: 1, maxLength: 253}
                target_port: {type: integer, minimum: 1, maximum: 65535}
      responses:
        '200': {description: Sanitized connectivity result for the exact active chain revision, content: {application/json: {schema: {$ref: '#/components/schemas/ChainTestResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Chain not found}
        '409': {description: Saved chain does not exactly match the active runtime revision}
        '503': {description: Chain testing unavailable}
  /api/v1/sessions:
    get:
      tags: [Sessions]
      responses:
        '200': {description: Newest-first bounded runtime sessions, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}
        '503': {description: Runtime session state unavailable}
  /api/v1/sessions/{sessionId}:
    parameters: [{name: sessionId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Sessions]
      responses:
        '200': {description: Runtime session, content: {application/json: {schema: {$ref: '#/components/schemas/ProxySession'}}}}
        '404': {description: Session not found}
    delete:
      tags: [Sessions]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '204': {description: Session removed; a matching request creates a new binding}
        '404': {description: Session not found}
  /api/v1/sessions/{sessionId}/rotate:
    parameters: [{name: sessionId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Sessions]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Session marked rotated; the next request selects a new proxy, content: {application/json: {schema: {$ref: '#/components/schemas/ProxySession'}}}}
        '404': {description: Session not found}
  /api/v1/policies:
    get:
      tags: [Policies]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned policy inventory, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyPage'}}}}
    post:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [policy], properties: {policy: {$ref: '#/components/schemas/Policy'}}}}}
      responses:
        '201': {description: Policy inventory record created, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/policies/{policyId}:
    parameters: [{name: policyId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Policies]
      responses: {'200': {description: Policy record, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyResponse'}}}}, '404': {description: Policy not found}}
    patch:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [policy, revision], properties: {policy: {$ref: '#/components/schemas/Policy'}, revision: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Updated policy record, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {description: Stale revision}}
    delete:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}}
      responses: {'204': {description: Policy deleted}, '409': {description: Stale revision}}
  /api/v1/policies/{policyId}/simulate:
    parameters: [{name: policyId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationRequest'}}}}
      responses: {'200': {description: Simulation result; does not activate runtime routing, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}}
  /api/v1/runtime:
    get:
      tags: [Runtime]
      responses:
        '200': {description: Active immutable routing revision, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeState'}}}}
  /api/v1/runtime/history:
    get:
      tags: [Runtime]
      parameters: [{name: before, in: query, schema: {type: integer, minimum: 1}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}]
      responses:
        '200': {description: Newest-first runtime revision history, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHistory'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/runtime/activate:
    post:
      tags: [Runtime]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 0}}}}}
      responses:
        '200': {description: Complete saved proxy, pool and policy inventory atomically activated, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeState'}}}}
        '400': {description: Saved inventory does not form a complete valid runtime configuration}
        '409': {description: Active runtime revision changed}
  /api/v1/runtime/rollback:
    post:
      tags: [Runtime]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_revision, target_revision], properties: {expected_revision: {type: integer, minimum: 1}, target_revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Historical bundle republished as a new active revision, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeState'}}}}
        '404': {description: Target runtime revision not found}
        '409': {description: Active runtime revision changed}
  /api/v1/clients:
    get:
      tags: [Clients]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned logical clients, content: {application/json: {schema: {$ref: '#/components/schemas/ClientPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 256}}}}}
      responses:
        '201': {description: Client created, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRecord'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/clients/{clientId}:
    parameters: [{name: clientId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Clients]
      responses:
        '200': {description: Revisioned logical client, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRecord'}}}}
        '404': {description: Client not found}
    patch:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, revision]
              properties:
                client: {$ref: '#/components/schemas/Client'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Updated client, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRecord'}}}}
        '409': {description: Client revision is stale}
    delete:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Client and its API keys deleted}
        '409': {description: Client revision is stale}
  /api/v1/clients/{clientId}/api-keys:
    parameters: [{name: clientId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Clients]
      responses:
        '200': {description: API-key metadata; raw tokens are never returned, content: {application/json: {schema: {$ref: '#/components/schemas/APIKeyPage'}}}}
    post:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '201': {description: Created key metadata and one-time raw token, content: {application/json: {schema: {$ref: '#/components/schemas/APIKeyCreation'}}}}
  /api/v1/clients/{clientId}/api-keys/{keyId}:
    parameters: [{name: clientId, in: path, required: true, schema: {type: string}}, {name: keyId, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '204': {description: API key revoked}
        '404': {description: Key not found or already revoked}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: proxysieve_session}
    csrfToken: {type: apiKey, in: header, name: X-CSRF-Token}
    clientBearer: {type: http, scheme: bearer, bearerFormat: ProxySieve API key}
  headers:
    SetCookie: {schema: {type: string}, description: Session and CSRF cookies}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    From: {name: from, in: query, required: true, schema: {type: string, format: date-time}}
    Until: {name: until, in: query, required: true, schema: {type: string, format: date-time}}
    ClientID: {name: client_id, in: query, schema: {type: string}}
    PoolID: {name: pool_id, in: query, schema: {type: string}}
    ProxyID: {name: proxy_id, in: query, schema: {type: string}}
    ChainID: {name: chain_id, in: query, schema: {type: string}}
    PolicyID: {name: policy_id, in: query, schema: {type: string}}
    RuleID: {name: rule_id, in: query, schema: {type: string}}
    Action: {name: action, in: query, schema: {type: string}}
    Protocol: {name: protocol, in: query, schema: {type: string}}
  requestBodies:
    HealthCheckTarget:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target_host, target_port]
            additionalProperties: false
            properties:
              target_host: {type: string, minLength: 1, maxLength: 253}
              target_port: {type: integer, minimum: 1, maximum: 65535}
  responses:
    BadRequest: {description: Request was not accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Request was forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource was not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
    SystemInfo:
      type: object
      required: [build, user, listeners]
      properties:
        build: {$ref: '#/components/schemas/BuildInfo'}
        user: {$ref: '#/components/schemas/User'}
        listeners: {type: array, items: {$ref: '#/components/schemas/ListenerStatus'}}
    BuildInfo:
      type: object
      required: [name, version, commit, build_date, go_version, platform, author, license]
      properties:
        name: {type: string}
        version: {type: string}
        commit: {type: string}
        build_date: {type: string}
        go_version: {type: string}
        platform: {type: string}
        author: {type: string}
        license: {type: string}
    ListenerStatus:
      type: object
      required: [name, type, bind, max_connections, accepted, active, rejected]
      properties:
        name: {type: string}
        type: {type: string, enum: [http, socks5, admin]}
        bind: {type: string}
        max_connections: {type: integer, minimum: 1}
        accepted: {type: integer, minimum: 0}
        active: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
    BrowserPolicySnapshot:
      type: object
      required: [version, revision, expires_at, client_id, policies]
      properties:
        version: {type: integer, const: 1}
        revision: {type: integer, minimum: 0}
        expires_at: {type: string, format: date-time}
        client_id: {type: string}
        policies: {type: array, items: {$ref: '#/components/schemas/Policy'}}
    BrowserBlockBatch:
      type: object
      additionalProperties: false
      required: [version, blocks]
      properties:
        version: {type: integer, const: 1}
        blocks:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [host, resource_type, session_id, estimated_bytes]
            properties:
              host: {type: string, minLength: 1, maxLength: 253}
              resource_type: {type: string, enum: [document, stylesheet, image, media, font, script, xhr, fetch, websocket, manifest, other, eventsource, texttrack, ping, csp_report, preflight]}
              session_id: {type: string, minLength: 1, maxLength: 128}
              policy_id: {type: string, maxLength: 128}
              rule_id: {type: string, maxLength: 128}
              estimated_bytes: {type: integer, minimum: 0, maximum: 9223372036854775807}
    SetupStatus:
      type: object
      required: [setup_required]
      properties: {setup_required: {type: boolean}}
    TrafficTotals:
      type: object
      required: [request_count, client_upload_bytes, client_download_bytes, upstream_upload_bytes, upstream_download_bytes, direct_bytes, cache_served_bytes, health_check_bytes, estimated_avoided_bytes]
      properties:
        request_count: {type: integer, minimum: 0}
        client_upload_bytes: {type: integer, minimum: 0}
        client_download_bytes: {type: integer, minimum: 0}
        upstream_upload_bytes: {type: integer, minimum: 0}
        upstream_download_bytes: {type: integer, minimum: 0}
        direct_bytes: {type: integer, minimum: 0}
        cache_served_bytes: {type: integer, minimum: 0}
        health_check_bytes: {type: integer, minimum: 0}
        estimated_avoided_bytes: {type: integer, minimum: 0}
    CostTotal:
      type: object
      required: [amount, priced_upstream_upload_bytes, priced_upstream_download_bytes]
      properties:
        amount: {type: object, required: [currency, micros], properties: {currency: {type: string}, micros: {type: integer, minimum: 0}}}
        priced_upstream_upload_bytes: {type: integer, minimum: 0}
        priced_upstream_download_bytes: {type: integer, minimum: 0}
    TrafficSummary:
      type: object
      required: [from, until, totals, configured_costs]
      properties:
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        totals: {$ref: '#/components/schemas/TrafficTotals'}
        configured_costs: {type: array, items: {$ref: '#/components/schemas/CostTotal'}}
    TrafficPoint:
      type: object
      required: [bucket_start, totals, configured_costs]
      properties:
        bucket_start: {type: string, format: date-time}
        totals: {$ref: '#/components/schemas/TrafficTotals'}
        configured_costs: {type: array, items: {$ref: '#/components/schemas/CostTotal'}}
    TrafficSeries:
      type: object
      required: [from, until, granularity, points]
      properties:
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        granularity: {type: string, enum: [minute, hour, day]}
        points: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/TrafficPoint'}}
    TrafficBreakdownItem:
      type: object
      required: [value, totals, configured_costs]
      properties:
        value: {type: string}
        totals: {$ref: '#/components/schemas/TrafficTotals'}
        configured_costs: {type: array, items: {$ref: '#/components/schemas/CostTotal'}}
    TrafficBreakdown:
      type: object
      required: [from, until, dimension, items]
      properties:
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        dimension: {type: string, enum: [client, pool, proxy, chain, policy, rule, action, protocol]}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TrafficBreakdownItem'}}
    BudgetConfig:
      type: object
      required: [id, name, scope, limit_bytes, hard, action, window]
      properties:
        id: {type: string}
        name: {type: string}
        scope: {type: string, enum: [system, client, pool, proxy]}
        scope_id: {type: string}
        limit_bytes: {type: integer, minimum: 1}
        soft_limit_bytes: {type: integer, minimum: 1, description: Optional warning threshold below limit_bytes}
        hard: {type: boolean, enum: [true]}
        action: {type: string, enum: [reject]}
        window: {type: string, enum: [lifetime, rolling, daily, weekly, monthly]}
        timezone: {type: string}
        rolling_seconds: {type: integer, minimum: 60, maximum: 31536000}
    BudgetStatus:
      allOf:
        - {$ref: '#/components/schemas/BudgetConfig'}
        - type: object
