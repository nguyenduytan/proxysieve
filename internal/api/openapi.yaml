        '200': {description: Revisioned routing-pool inventory, content: {application/json: {schema: {$ref: '#/components/schemas/PoolPage'}}}}
    post:
      tags: [Pools]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [pool], properties: {pool: {$ref: '#/components/schemas/PoolInput'}}}}}
      responses:
        '201': {description: Pool inventory record created, content: {application/json: {schema: {$ref: '#/components/schemas/PoolResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Pool ID already exists}
  /api/v1/pools/{poolId}:
    parameters: [{name: poolId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Pools]
      responses:
        '200': {description: Pool inventory record, content: {application/json: {schema: {$ref: '#/components/schemas/PoolResponse'}}}}
        '404': {description: Pool not found}
    patch:
      tags: [Pools]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pool, revision]
              properties:
                pool: {$ref: '#/components/schemas/Pool'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Pool inventory record updated, content: {application/json: {schema: {$ref: '#/components/schemas/PoolResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Pool not found}
        '409': {description: Stale pool revision}
    delete:
      tags: [Pools]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Pool inventory record deleted}
        '404': {description: Pool not found}
        '409': {description: Stale revision or pool is used as a fallback}
  /api/v1/chains:
    get:
      tags: [Chains]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned ordered proxy-chain inventory, content: {application/json: {schema: {$ref: '#/components/schemas/ChainPage'}}}}
    post:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [chain], properties: {chain: {$ref: '#/components/schemas/ChainInput'}}}}}
      responses:
        '201': {description: Chain inventory record created, content: {application/json: {schema: {$ref: '#/components/schemas/ChainResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Chain ID already exists}
  /api/v1/chains/{chainId}:
    parameters: [{name: chainId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Chains]
      responses:
        '200': {description: Chain inventory record, content: {application/json: {schema: {$ref: '#/components/schemas/ChainResponse'}}}}
        '404': {description: Chain not found}
    patch:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [chain, revision], properties: {chain: {$ref: '#/components/schemas/Chain'}, revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Chain inventory record updated, content: {application/json: {schema: {$ref: '#/components/schemas/ChainResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Chain not found}
        '409': {description: Stale chain revision}
    delete:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Chain inventory record deleted}
