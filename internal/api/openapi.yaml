openapi: 3.1.0
info:
  title: ProxySieve local control-plane API
  version: 0.1.0
  description: >-
    The authenticated local Admin API exposed by ProxySieve. This contract
    describes the implemented surface; planned resources are intentionally omitted.
servers:
  - url: http://127.0.0.1:9090
    description: Default local-only listener
tags:
  - name: Auth
  - name: System
  - name: Traffic
  - name: Health
  - name: Proxies
  - name: Sources
  - name: Pools
  - name: Chains
  - name: Sessions
  - name: Policies
  - name: Runtime
  - name: Clients
  - name: Audit
paths:
  /health:
    get:
      tags: [System]
      security: []
      responses:
        '200': {description: Healthy}
  /ready:
    get:
      tags: [System]
      security: []
      responses:
        '200': {description: Ready}
  /api/v1/openapi.yaml:
    get:
      tags: [System]
      security: []
      responses:
        '200':
          description: OpenAPI contract
          content:
            application/yaml: {schema: {type: string}}
  /api/v1/auth/setup-status:
    get:
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Whether first-run setup is required
          content:
            application/json: {schema: {$ref: '#/components/schemas/SetupStatus'}}
  /api/v1/auth/setup:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: {type: string}
                username: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, format: password, minLength: 12}
      responses:
        '201': {description: Administrator created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200': {description: Authenticated user, headers: {Set-Cookie: {$ref: '#/components/headers/SetCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '204': {description: Session ended}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/system/info:
    get:
      tags: [System]
      responses:
        '200': {description: Build and current user information}
  /api/v1/traffic/live:
    get:
      tags: [Traffic]
      responses:
        '200': {description: Bounded live event buffer and persistence stats}
  /api/v1/traffic/history:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Recent durable events}
  /api/v1/traffic/summary:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/Until'}, {$ref: '#/components/parameters/ClientID'}, {$ref: '#/components/parameters/PoolID'}, {$ref: '#/components/parameters/ProxyID'}, {$ref: '#/components/parameters/ChainID'}, {$ref: '#/components/parameters/PolicyID'}, {$ref: '#/components/parameters/RuleID'}, {$ref: '#/components/parameters/Action'}, {$ref: '#/components/parameters/Protocol'}]
      responses:
        '200': {description: Bounded traffic summary, content: {application/json: {schema: {$ref: '#/components/schemas/TrafficSummary'}}}}
  /api/v1/traffic/timeseries:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/Until'}, {$ref: '#/components/parameters/ClientID'}, {$ref: '#/components/parameters/PoolID'}, {$ref: '#/components/parameters/ProxyID'}, {$ref: '#/components/parameters/ChainID'}, {$ref: '#/components/parameters/PolicyID'}, {$ref: '#/components/parameters/RuleID'}, {$ref: '#/components/parameters/Action'}, {$ref: '#/components/parameters/Protocol'}, {name: granularity, in: query, required: true, schema: {type: string, enum: [minute, hour, day]}}]
      responses:
        '200': {description: Bounded traffic series, content: {application/json: {schema: {$ref: '#/components/schemas/TrafficSeries'}}}}
  /api/v1/traffic/breakdown:
    get:
      tags: [Traffic]
      parameters: [{$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/Until'}, {$ref: '#/components/parameters/ClientID'}, {$ref: '#/components/parameters/PoolID'}, {$ref: '#/components/parameters/ProxyID'}, {$ref: '#/components/parameters/ChainID'}, {$ref: '#/components/parameters/PolicyID'}, {$ref: '#/components/parameters/RuleID'}, {$ref: '#/components/parameters/Action'}, {$ref: '#/components/parameters/Protocol'}, {name: dimension, in: query, required: true, schema: {type: string, enum: [client, pool, proxy, chain, policy, rule, action, protocol]}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}]
      responses:
        '200': {description: Top traffic values for one bounded dimension, content: {application/json: {schema: {$ref: '#/components/schemas/TrafficBreakdown'}}}}
  /api/v1/health/proxies:
    get:
      tags: [Health]
      responses:
        '200': {description: Active runtime proxy health, content: {application/json: {schema: {$ref: '#/components/schemas/ProxyHealthPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/health/pools:
    get:
      tags: [Health]
      responses:
        '200': {description: Active runtime pool health, content: {application/json: {schema: {$ref: '#/components/schemas/PoolHealthPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/health/proxies/{proxyId}/check:
    post:
      tags: [Health]
      security: [sessionCookie: [], csrfToken: []]
      parameters: [{name: proxyId, in: path, required: true, schema: {type: string}}]
      requestBody: {$ref: '#/components/requestBodies/HealthCheckTarget'}
      responses:
        '200': {description: Updated proxy health, content: {application/json: {schema: {type: object, required: [result], properties: {result: {$ref: '#/components/schemas/ProxyHealth'}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Proxy disabled or check already running}
  /api/v1/health/pools/{poolId}/check:
    post:
      tags: [Health]
      security: [sessionCookie: [], csrfToken: []]
      parameters: [{name: poolId, in: path, required: true, schema: {type: string}}]
      requestBody: {$ref: '#/components/requestBodies/HealthCheckTarget'}
      responses:
        '200': {description: Updated pool health, content: {application/json: {schema: {type: object, required: [result], properties: {result: {$ref: '#/components/schemas/PoolHealth'}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Pool disabled or an endpoint check already running}
  /api/v1/audit:
    get:
      tags: [Audit]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: before, in: query, schema: {type: string, format: date-time}}, {name: before_id, in: query, schema: {type: string}}]
      responses:
        '200':
          description: Sanitized administrator audit events with a stable timestamp/id cursor
          content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/proxies:
    get:
      tags: [Proxies]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Proxy inventory}
    post:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [endpoint], properties: {endpoint: {type: object}}}}
      responses:
        '201': {description: Proxy inventory record created}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/proxies/import/preview:
    post:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [input], properties: {input: {type: string}}}}}
      responses:
        '200': {description: Parsed proxy import preview}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/proxies/import:
    post:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: {type: string, maxLength: 8388608}
                mode: {type: string, enum: [skip, update, create], default: skip}
      responses:
        '201': {description: Proxy inventory import committed atomically}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Inventory changed during import}
  /api/v1/proxies/{proxyId}:
    parameters: [{name: proxyId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Proxies]
      responses:
        '200': {description: Proxy inventory record}
        '404': {description: Proxy not found}
    patch:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, revision]
              properties:
                endpoint: {$ref: '#/components/schemas/ProxyEndpoint'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Proxy inventory record updated}
        '409': {description: Stale proxy revision}
        '404': {description: Proxy not found}
    delete:
      tags: [Proxies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '204': {description: Proxy inventory record deleted}
        '409': {description: Stale proxy revision}
        '404': {description: Proxy not found}
  /api/v1/sources:
    get:
      tags: [Sources]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Proxy source inventory}
    post:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: {$ref: '#/components/schemas/ProxySource'}
      responses:
        '201': {description: Proxy source created}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Source ID already exists}
  /api/v1/sources/{sourceId}:
    parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Sources]
      responses:
        '200': {description: Proxy source record}
        '404': {description: Source not found}
    patch:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, revision]
              properties:
                source: {$ref: '#/components/schemas/ProxySource'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Proxy source updated}
        '409': {description: Stale source revision}
        '404': {description: Source not found}
    delete:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '204': {description: Proxy source deleted}
        '409': {description: Stale source revision}
        '404': {description: Source not found}
  /api/v1/sources/{sourceId}/refresh:
    parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Sources]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Source fetched and endpoint inventory reconciled atomically
          content:
            application/json:
              schema:
                type: object
                required: [source, created, updated, skipped, invalid]
                properties:
                  source:
                    type: object
                    required: [source, revision]
                    properties:
                      source: {$ref: '#/components/schemas/ProxySource'}
                      revision: {type: integer, minimum: 1}
                  created: {type: integer, minimum: 0}
                  updated: {type: integer, minimum: 0}
                  skipped: {type: integer, minimum: 0}
                  invalid: {type: integer, minimum: 0}
        '409': {description: Source disabled, already refreshing or revision changed during refresh}
        '422': {description: Source type, configuration or proxy input is unsupported or invalid}
        '502': {description: Source fetch rejected or failed}
        '503': {description: Atomic inventory storage unavailable}
  /api/v1/pools:
    get:
      tags: [Pools]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned routing-pool inventory, content: {application/json: {schema: {$ref: '#/components/schemas/PoolPage'}}}}
    post:
      tags: [Pools]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [pool], properties: {pool: {$ref: '#/components/schemas/PoolInput'}}}}}
      responses:
        '201': {description: Pool inventory record created, content: {application/json: {schema: {$ref: '#/components/schemas/PoolResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Pool ID already exists}
  /api/v1/pools/{poolId}:
    parameters: [{name: poolId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Pools]
      responses:
        '200': {description: Pool inventory record, content: {application/json: {schema: {$ref: '#/components/schemas/PoolResponse'}}}}
        '404': {description: Pool not found}
    patch:
      tags: [Pools]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pool, revision]
              properties:
                pool: {$ref: '#/components/schemas/Pool'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Pool inventory record updated, content: {application/json: {schema: {$ref: '#/components/schemas/PoolResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Pool not found}
        '409': {description: Stale pool revision}
    delete:
      tags: [Pools]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Pool inventory record deleted}
        '404': {description: Pool not found}
        '409': {description: Stale revision or pool is used as a fallback}
  /api/v1/chains:
    get:
      tags: [Chains]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned ordered proxy-chain inventory, content: {application/json: {schema: {$ref: '#/components/schemas/ChainPage'}}}}
    post:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [chain], properties: {chain: {$ref: '#/components/schemas/ChainInput'}}}}}
      responses:
        '201': {description: Chain inventory record created, content: {application/json: {schema: {$ref: '#/components/schemas/ChainResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Chain ID already exists}
  /api/v1/chains/{chainId}:
    parameters: [{name: chainId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Chains]
      responses:
        '200': {description: Chain inventory record, content: {application/json: {schema: {$ref: '#/components/schemas/ChainResponse'}}}}
        '404': {description: Chain not found}
    patch:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [chain, revision], properties: {chain: {$ref: '#/components/schemas/Chain'}, revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Chain inventory record updated, content: {application/json: {schema: {$ref: '#/components/schemas/ChainResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Chain not found}
        '409': {description: Stale chain revision}
    delete:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Chain inventory record deleted}
        '404': {description: Chain not found}
        '409': {description: Stale revision or chain is referenced by a policy}
  /api/v1/chains/{chainId}/test:
    parameters: [{name: chainId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Chains]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_host, target_port]
              properties:
                target_host: {type: string, minLength: 1, maxLength: 253}
                target_port: {type: integer, minimum: 1, maximum: 65535}
      responses:
        '200': {description: Sanitized connectivity result for the exact active chain revision, content: {application/json: {schema: {$ref: '#/components/schemas/ChainTestResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Chain not found}
        '409': {description: Saved chain does not exactly match the active runtime revision}
        '503': {description: Chain testing unavailable}
  /api/v1/sessions:
    get:
      tags: [Sessions]
      responses:
        '200': {description: Newest-first bounded runtime sessions, content: {application/json: {schema: {$ref: '#/components/schemas/SessionPage'}}}}
        '503': {description: Runtime session state unavailable}
  /api/v1/sessions/{sessionId}:
    parameters: [{name: sessionId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Sessions]
      responses:
        '200': {description: Runtime session, content: {application/json: {schema: {$ref: '#/components/schemas/ProxySession'}}}}
        '404': {description: Session not found}
    delete:
      tags: [Sessions]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '204': {description: Session removed; a matching request creates a new binding}
        '404': {description: Session not found}
  /api/v1/sessions/{sessionId}/rotate:
    parameters: [{name: sessionId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Sessions]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '200': {description: Session marked rotated; the next request selects a new proxy, content: {application/json: {schema: {$ref: '#/components/schemas/ProxySession'}}}}
        '404': {description: Session not found}
  /api/v1/policies:
    get:
      tags: [Policies]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned policy inventory, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyPage'}}}}
    post:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [policy], properties: {policy: {$ref: '#/components/schemas/Policy'}}}}}
      responses:
        '201': {description: Policy inventory record created, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyResponse'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/policies/{policyId}:
    parameters: [{name: policyId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Policies]
      responses: {'200': {description: Policy record, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyResponse'}}}}, '404': {description: Policy not found}}
    patch:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [policy, revision], properties: {policy: {$ref: '#/components/schemas/Policy'}, revision: {type: integer, minimum: 1}}}}}}
      responses: {'200': {description: Updated policy record, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {description: Stale revision}}
    delete:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}}
      responses: {'204': {description: Policy deleted}, '409': {description: Stale revision}}
  /api/v1/policies/{policyId}/simulate:
    parameters: [{name: policyId, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Policies]
      security: [sessionCookie: [], csrfToken: []]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationRequest'}}}}
      responses: {'200': {description: Simulation result; does not activate runtime routing, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationResponse'}}}}, '400': {$ref: '#/components/responses/BadRequest'}}
  /api/v1/runtime:
    get:
      tags: [Runtime]
      responses:
        '200': {description: Active immutable routing revision, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeState'}}}}
  /api/v1/runtime/history:
    get:
      tags: [Runtime]
      parameters: [{name: before, in: query, schema: {type: integer, minimum: 1}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}]
      responses:
        '200': {description: Newest-first runtime revision history, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeHistory'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/runtime/activate:
    post:
      tags: [Runtime]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_revision], properties: {expected_revision: {type: integer, minimum: 0}}}}}
      responses:
        '200': {description: Complete saved proxy, pool and policy inventory atomically activated, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeState'}}}}
        '400': {description: Saved inventory does not form a complete valid runtime configuration}
        '409': {description: Active runtime revision changed}
  /api/v1/runtime/rollback:
    post:
      tags: [Runtime]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_revision, target_revision], properties: {expected_revision: {type: integer, minimum: 1}, target_revision: {type: integer, minimum: 1}}}}}
      responses:
        '200': {description: Historical bundle republished as a new active revision, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeState'}}}}
        '404': {description: Target runtime revision not found}
        '409': {description: Active runtime revision changed}
  /api/v1/clients:
    get:
      tags: [Clients]
      parameters: [{$ref: '#/components/parameters/Limit'}, {name: after, in: query, schema: {type: string}}]
      responses:
        '200': {description: Revisioned logical clients, content: {application/json: {schema: {$ref: '#/components/schemas/ClientPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 256}}}}}
      responses:
        '201': {description: Client created, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRecord'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/clients/{clientId}:
    parameters: [{name: clientId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Clients]
      responses:
        '200': {description: Revisioned logical client, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRecord'}}}}
        '404': {description: Client not found}
    patch:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, revision]
              properties:
                client: {$ref: '#/components/schemas/Client'}
                revision: {type: integer, minimum: 1}
      responses:
        '200': {description: Updated client, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRecord'}}}}
        '409': {description: Client revision is stale}
    delete:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [revision], properties: {revision: {type: integer, minimum: 1}}}}}
      responses:
        '204': {description: Client and its API keys deleted}
        '409': {description: Client revision is stale}
  /api/v1/clients/{clientId}/api-keys:
    parameters: [{name: clientId, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Clients]
      responses:
        '200': {description: API-key metadata; raw tokens are never returned, content: {application/json: {schema: {$ref: '#/components/schemas/APIKeyPage'}}}}
    post:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '201': {description: Created key metadata and one-time raw token, content: {application/json: {schema: {$ref: '#/components/schemas/APIKeyCreation'}}}}
  /api/v1/clients/{clientId}/api-keys/{keyId}:
    parameters: [{name: clientId, in: path, required: true, schema: {type: string}}, {name: keyId, in: path, required: true, schema: {type: string}}]
    delete:
      tags: [Clients]
      security: [sessionCookie: [], csrfToken: []]
      responses:
        '204': {description: API key revoked}
        '404': {description: Key not found or already revoked}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: proxysieve_session}
    csrfToken: {type: apiKey, in: header, name: X-CSRF-Token}
  headers:
    SetCookie: {schema: {type: string}, description: Session and CSRF cookies}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
    From: {name: from, in: query, required: true, schema: {type: string, format: date-time}}
    Until: {name: until, in: query, required: true, schema: {type: string, format: date-time}}
    ClientID: {name: client_id, in: query, schema: {type: string}}
    PoolID: {name: pool_id, in: query, schema: {type: string}}
    ProxyID: {name: proxy_id, in: query, schema: {type: string}}
    ChainID: {name: chain_id, in: query, schema: {type: string}}
    PolicyID: {name: policy_id, in: query, schema: {type: string}}
    RuleID: {name: rule_id, in: query, schema: {type: string}}
    Action: {name: action, in: query, schema: {type: string}}
    Protocol: {name: protocol, in: query, schema: {type: string}}
  requestBodies:
    HealthCheckTarget:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [target_host, target_port]
            additionalProperties: false
            properties:
              target_host: {type: string, minLength: 1, maxLength: 253}
              target_port: {type: integer, minimum: 1, maximum: 65535}
  responses:
    BadRequest: {description: Request was not accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Request was forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource was not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}}}
    SetupStatus:
      type: object
      required: [setup_required]
      properties: {setup_required: {type: boolean}}
    TrafficTotals:
      type: object
      required: [request_count, client_upload_bytes, client_download_bytes, upstream_upload_bytes, upstream_download_bytes, direct_bytes, cache_served_bytes, health_check_bytes, estimated_avoided_bytes]
      properties:
        request_count: {type: integer, minimum: 0}
        client_upload_bytes: {type: integer, minimum: 0}
        client_download_bytes: {type: integer, minimum: 0}
        upstream_upload_bytes: {type: integer, minimum: 0}
        upstream_download_bytes: {type: integer, minimum: 0}
        direct_bytes: {type: integer, minimum: 0}
        cache_served_bytes: {type: integer, minimum: 0}
        health_check_bytes: {type: integer, minimum: 0}
        estimated_avoided_bytes: {type: integer, minimum: 0}
    CostTotal:
      type: object
      required: [amount, priced_upstream_upload_bytes, priced_upstream_download_bytes]
      properties:
        amount: {type: object, required: [currency, micros], properties: {currency: {type: string}, micros: {type: integer, minimum: 0}}}
        priced_upstream_upload_bytes: {type: integer, minimum: 0}
        priced_upstream_download_bytes: {type: integer, minimum: 0}
    TrafficSummary:
      type: object
      required: [from, until, totals, configured_costs]
      properties:
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        totals: {$ref: '#/components/schemas/TrafficTotals'}
        configured_costs: {type: array, items: {$ref: '#/components/schemas/CostTotal'}}
    TrafficPoint:
      type: object
      required: [bucket_start, totals, configured_costs]
      properties:
        bucket_start: {type: string, format: date-time}
        totals: {$ref: '#/components/schemas/TrafficTotals'}
        configured_costs: {type: array, items: {$ref: '#/components/schemas/CostTotal'}}
    TrafficSeries:
      type: object
      required: [from, until, granularity, points]
      properties:
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        granularity: {type: string, enum: [minute, hour, day]}
        points: {type: array, maxItems: 2000, items: {$ref: '#/components/schemas/TrafficPoint'}}
    TrafficBreakdownItem:
      type: object
      required: [value, totals, configured_costs]
      properties:
        value: {type: string}
        totals: {$ref: '#/components/schemas/TrafficTotals'}
        configured_costs: {type: array, items: {$ref: '#/components/schemas/CostTotal'}}
    TrafficBreakdown:
      type: object
      required: [from, until, dimension, items]
      properties:
        from: {type: string, format: date-time}
        until: {type: string, format: date-time}
        dimension: {type: string, enum: [client, pool, proxy, chain, policy, rule, action, protocol]}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TrafficBreakdownItem'}}
    User:
      type: object
      required: [id, username, role, enabled, created_at]
      properties:
        id: {type: string}
        username: {type: string}
        role: {type: string, enum: [admin, operator, viewer]}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time}
    Client:
      type: object
      required: [id, name, enabled, auth_method, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        auth_method: {type: string}
        created_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
    ClientRecord:
      allOf:
        - {$ref: '#/components/schemas/Client'}
        - type: object
          required: [revision]
          properties:
            revision: {type: integer, minimum: 1}
    ClientPage:
      type: object
      required: [items, next_after]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ClientRecord'}}
        next_after: {type: string}
    APIKey:
      type: object
      required: [id, client_id, prefix, created_at]
      properties:
        id: {type: string}
        client_id: {type: string}
        prefix: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    APIKeyPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/APIKey'}}
    APIKeyCreation:
      type: object
      required: [api_key, token]
      properties:
        api_key: {$ref: '#/components/schemas/APIKey'}
        token: {type: string, writeOnly: true, description: Returned once and never stored in plaintext}
    AuditEvent:
      type: object
      required: [id, at, action, target_type]
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        actor_id: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        request_id: {type: string}
    AuditPage:
      type: object
      required: [items, next_before, next_before_id]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_before: {type: string, format: date-time}
        next_before_id: {type: string}
    PoolInput:
      type: object
      description: Pool metadata accepted on create; omit id to let the server generate it.
      required: [name, strategy, endpoint_ids, fallback_pool_ids, required_tags, min_health_score, max_latency_ns, enabled]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 256}
        strategy: {type: string, enum: [random, round-robin, weighted-random, least-connections, least-traffic, lowest-latency, highest-health, lowest-cost, cost-aware, sticky]}
        endpoint_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string}}
        fallback_pool_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string}}
        required_tags: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string, minLength: 1, maxLength: 128}}
        country: {type: string, maxLength: 128}
        min_health_score: {type: integer, minimum: 0, maximum: 100}
        max_latency_ns: {type: integer, minimum: 0}
        session_policy: {$ref: '#/components/schemas/SessionPolicy'}
        enabled: {type: boolean}
    SessionPolicy:
      type: object
      required: [strategy, ttl_ns, idle_ttl_ns, max_requests, max_bytes]
      properties:
        strategy: {type: string, enum: [none, explicit, client, destination, client_destination]}
        ttl_ns: {type: integer, minimum: 0, maximum: 31536000000000000}
        idle_ttl_ns: {type: integer, minimum: 0, maximum: 31536000000000000}
        max_requests: {type: integer, minimum: 0}
        max_bytes: {type: integer, minimum: 0}
    ProxySession:
      type: object
      required: [id, client_id, key_hash, pool_id, proxy_endpoint_id, created_at, last_used_at, expires_at, idle_expires_at, request_count, upload_bytes, download_bytes, status, rotation_reason, policy, runtime_revision]
      properties:
        id: {type: string}
        client_id: {type: string}
        key_hash: {type: string, description: HMAC digest; the raw affinity key is never stored or returned}
        pool_id: {type: string}
        proxy_endpoint_id: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
        request_count: {type: integer, minimum: 0}
        upload_bytes: {type: integer, minimum: 0}
        download_bytes: {type: integer, minimum: 0}
        status: {type: string, enum: [active, rotated]}
        rotation_reason: {type: string, enum: [created, none, manual, expired, idle_expired, request_limit, byte_limit, policy_change, health_quarantine, proxy_failed]}
        policy: {$ref: '#/components/schemas/SessionPolicy'}
        runtime_revision: {type: integer, minimum: 0}
    SessionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/ProxySession'}}
    Pool:
      allOf:
        - {$ref: '#/components/schemas/PoolInput'}
        - {type: object, required: [id]}
    PoolRecord:
      type: object
      required: [pool, revision]
      properties:
        pool: {$ref: '#/components/schemas/Pool'}
        revision: {type: integer, minimum: 1}
    PoolPage:
      type: object
      required: [items, next_after]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PoolRecord'}}
        next_after: {type: string}
    PoolResponse:
      type: object
      required: [pool, runtime_active, activation, runtime_revision]
      properties:
        pool: {$ref: '#/components/schemas/PoolRecord'}
        runtime_active: {type: boolean}
        activation: {type: string, enum: [active, staged]}
        runtime_revision: {type: integer, minimum: 0}
    ChainHop:
      type: object
      required: [pool_id, timeout_ns]
      properties:
        pool_id: {type: string}
        timeout_ns: {type: integer, minimum: 0, maximum: 120000000000}
    ChainInput:
      type: object
      description: Ordered chain metadata accepted on create; omit id to let the server generate it.
      required: [name, hops, enabled]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 256}
        hops: {type: array, minItems: 2, maxItems: 8, items: {$ref: '#/components/schemas/ChainHop'}}
        enabled: {type: boolean}
    Chain:
      allOf:
        - {$ref: '#/components/schemas/ChainInput'}
        - {type: object, required: [id]}
    ChainRecord:
      type: object
      required: [chain, revision]
      properties: {chain: {$ref: '#/components/schemas/Chain'}, revision: {type: integer, minimum: 1}}
    ChainResponse:
      type: object
      required: [chain, runtime_active, activation, runtime_revision]
      properties: {chain: {$ref: '#/components/schemas/ChainRecord'}, runtime_active: {type: boolean}, activation: {type: string, enum: [active, staged]}, runtime_revision: {type: integer, minimum: 0}, health: {$ref: '#/components/schemas/ChainHealth'}}
    ChainPage:
      type: object
      required: [items, next_after]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ChainResponse'}}, next_after: {type: string}}
    ChainHealth:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [untested, healthy, unhealthy]}
        tested_at: {type: string, format: date-time}
        latency_ns: {type: integer, minimum: 0}
        failure_reason: {type: string, enum: [route_unavailable, connect_failed]}
        failed_hop: {type: integer, minimum: 1, maximum: 8}
        pool_id: {type: string}
        proxy_id: {type: string}
    ProxyHealth:
      type: object
      required: [proxy_id, name, state, circuit, score, latency_ns, connect_latency_ns, ttfb_ns, throughput_bytes_per_sec, observations, successes, failures, timeouts, auth_failures, dns_failures, tls_failures, status_403, status_407, status_429, status_5xx, consecutive_failures]
      properties:
        proxy_id: {type: string}
        name: {type: string}
        state: {type: string, enum: [unknown, healthy, degraded, quarantined, half_open, disabled]}
        circuit: {type: string, enum: [closed, open, half_open]}
        score: {type: integer, minimum: 0, maximum: 100}
        latency_ns: {type: integer, minimum: 0}
        connect_latency_ns: {type: integer, minimum: 0}
        ttfb_ns: {type: integer, minimum: 0}
        throughput_bytes_per_sec: {type: integer, minimum: 0}
        observations: {type: integer, minimum: 0, maximum: 100}
        successes: {type: integer, minimum: 0, maximum: 100}
        failures: {type: integer, minimum: 0, maximum: 100}
        timeouts: {type: integer, minimum: 0, maximum: 100}
        auth_failures: {type: integer, minimum: 0, maximum: 100}
        dns_failures: {type: integer, minimum: 0, maximum: 100}
        tls_failures: {type: integer, minimum: 0, maximum: 100}
        status_403: {type: integer, minimum: 0, maximum: 100}
        status_407: {type: integer, minimum: 0, maximum: 100}
        status_429: {type: integer, minimum: 0, maximum: 100}
        status_5xx: {type: integer, minimum: 0, maximum: 100}
        consecutive_failures: {type: integer, minimum: 0}
        last_success: {type: string, format: date-time}
        last_failure: {type: string, format: date-time}
    ProxyHealthPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/ProxyHealth'}}}
    PoolHealth:
      type: object
      required: [pool_id, name, enabled, total, eligible, unknown, healthy, degraded, quarantined, half_open, disabled]
      properties:
        pool_id: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        total: {type: integer, minimum: 0}
        eligible: {type: integer, minimum: 0}
        unknown: {type: integer, minimum: 0}
        healthy: {type: integer, minimum: 0}
        degraded: {type: integer, minimum: 0}
        quarantined: {type: integer, minimum: 0}
        half_open: {type: integer, minimum: 0}
        disabled: {type: integer, minimum: 0}
    PoolHealthPage:
      type: object
      required: [items]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/PoolHealth'}}}
    ChainTestResponse:
      type: object
      required: [result]
      properties:
        result: {$ref: '#/components/schemas/ChainHealth'}
    Policy:
      type: object
      required: [version, id, name, rules]
      properties:
        version: {type: integer, const: 1}
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 256}
        rules: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/PolicyRule'}}
    PolicyRule:
      type: object
      required: [id, name, priority, enabled, stop_processing, conditions, actions]
      properties:
        id: {type: string}
        name: {type: string}
        priority: {type: integer}
        enabled: {type: boolean}
        stop_processing: {type: boolean}
        conditions: {type: object}
        actions: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/PolicyAction'}}
    PolicyAction:
      type: object
      required: [type]
      properties:
        type: {type: string}
        pool_id: {type: string}
        chain_id: {type: string}
        fallback_chain_ids: {type: array, maxItems: 15, uniqueItems: true, items: {type: string}}
        value: {type: string, maxLength: 4096}
    PolicyRecord:
      type: object
      required: [policy, revision]
      properties: {policy: {$ref: '#/components/schemas/Policy'}, revision: {type: integer, minimum: 1}}
    PolicyPage:
      type: object
      required: [items, next_after]
      properties: {items: {type: array, items: {$ref: '#/components/schemas/PolicyRecord'}}, next_after: {type: string}}
    PolicyResponse:
      type: object
      required: [policy, runtime_active, activation, runtime_revision]
      properties: {policy: {$ref: '#/components/schemas/PolicyRecord'}, runtime_active: {type: boolean}, activation: {type: string, enum: [active, staged]}, runtime_revision: {type: integer, minimum: 0}}
    RuntimeState:
      type: object
      required: [revision, source, proxy_count, pool_count, chain_count, policy_count, staged_changes]
      properties:
        revision: {type: integer, minimum: 0}
        source: {type: string, enum: [configuration, inventory, rollback]}
        activated_at: {type: string, format: date-time}
        activated_by: {type: string}
        source_revision: {type: integer, minimum: 1}
        proxy_count: {type: integer, minimum: 0}
        pool_count: {type: integer, minimum: 0}
        chain_count: {type: integer, minimum: 0}
        policy_count: {type: integer, minimum: 0}
        staged_changes: {type: boolean, description: Saved inventory differs from the active snapshot; false for history entries}
    RuntimeHistory:
      type: object
      required: [items, next_before]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RuntimeState'}}
        next_before: {type: integer, minimum: 0}
    SimulationRequest:
      type: object
      required: [listener, protocol, host, port]
      properties: {listener: {type: string}, client_id: {type: string}, protocol: {type: string}, scheme: {type: string}, host: {type: string}, port: {type: integer, minimum: 1, maximum: 65535}, method: {type: string}, path: {type: string}, destination_ip: {type: string}, timestamp: {type: string, format: date-time}}
    SimulationResponse:
      type: object
      required: [policy_id, revision, outcome, actions, matched_rule_ids, rules, unknown_fields, simulation_only, runtime_active]
      properties: {policy_id: {type: string}, revision: {type: integer}, outcome: {type: string}, actions: {type: array, items: {type: object}}, matched_rule_ids: {type: array, items: {type: string}}, rules: {type: array, items: {type: object}}, unknown_fields: {type: array, items: {type: string}}, simulation_only: {type: boolean, const: true}, runtime_active: {type: boolean}}
    ProxyEndpoint:
      type: object
      required: [id, name, protocol, host, port, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        protocol: {type: string, enum: [http, https, socks5, socks5h]}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        credential_ref: {type: string}
        provider_id: {type: string}
        source_id: {type: string}
        tags: {type: array, items: {type: string}}
        country: {type: string}
        weight: {type: integer, minimum: 0}
        priority: {type: integer}
        enabled: {type: boolean}
        trusted_remote_dns: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        metadata: {type: object, additionalProperties: {type: string}}
    ProxySource:
      type: object
      required: [id, name, type, refresh_interval_ns, enabled]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1, maxLength: 256}
        type: {type: string, enum: [manual, file, api, provider, rotating]}
        provider_id: {type: string}
        config: {type: object, maxProperties: 32, additionalProperties: {type: string, maxLength: 4096}}
        refresh_interval_ns: {type: integer, minimum: 0, maximum: 2592000000000000}
        last_refresh_at: {type: string, format: date-time, readOnly: true}
        last_refresh_status: {type: string, maxLength: 256, readOnly: true}
        credential_ref: {type: string}
        enabled: {type: boolean}
